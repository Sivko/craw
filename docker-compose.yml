version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: craw_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-craw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-craw_password}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-craw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - craw_network

  redis:
    image: redis:7-alpine
    container_name: craw_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - craw_network

volumes:
  postgres_data:
  redis_data:

networks:
  craw_network:
    driver: bridge
